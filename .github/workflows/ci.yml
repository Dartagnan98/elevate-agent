name: CI

# Gate before code auto-updates the fleet. run_tests.sh is the canonical
# hermetic runner (mirrors this workflow's env); the frontend job typechecks +
# builds + runs vitest. behavioral_eval is intentionally NOT here — it needs a
# live model provider login, so it stays a local release precondition.
on:
  push:
    branches: [main, ship-readiness]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python tests + skills lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Embedded Postgres (pgserver) downloads an ~80MB binary on first boot;
      # cache it so the memory/session-DB tests don't re-fetch every run.
      - name: Cache embedded Postgres binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/pgserver
          key: pgserver-${{ runner.os }}

      - name: Create venv + install (dev extra = pytest/xdist/asyncio)
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          # If a test errors on a missing optional import, add its extra here
          # (e.g. cron, honcho, mcp) — start minimal and widen as CI shakes out.
          .venv/bin/pip install -e ".[dev]"

      - name: Run tests (hermetic — TZ=UTC, creds blanked, fresh ELEVATE_HOME)
        env:
          ELEVATE_HOME: ${{ runner.temp }}/elevate-home
        run: bash scripts/run_tests.sh

  frontend:
    name: Web typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: cli/web/.node-version
          cache: npm
          cache-dependency-path: cli/web/package-lock.json

      - run: npm ci

      # `build` = `tsc -b && vite build` — typecheck gate + bundles.
      - run: npm run build

      - run: npm test
